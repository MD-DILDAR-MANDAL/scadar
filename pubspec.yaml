    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  dio: ^5.10.0
  intl: ^0.20.3
  get_it: ^9.2.1
